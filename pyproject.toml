# Solo configuración de herramientas. Las dependencias viven en requirements.txt:
# si aquí hubiera una tabla [project], Vercel la usaría y no instalaría FastAPI.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # tildes y signos del español en textos y comentarios
