name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    env:
      # Token de grano fino con escritura SOLO sobre daveprojectdev/qa. Sin él,
      # el paso de publicar se salta.
      QA_TOKEN: ${{ secrets.QA_TOKEN }}
    strategy:
      matrix:
        # 3.12 es la que usa Vercel en producción; 3.14, la del desarrollo local.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      # qa.davidameth.dev muestra la corrida «en ejecución» mientras dura: aquí
      # se deja el aviso y el último paso lo borra, termine como termine.
      - name: Avisar a qa.davidameth.dev que empezó
        continue-on-error: true
        if: ${{ env.QA_TOKEN != '' && github.event_name == 'push' && matrix.python == '3.12' }}
        env:
          GH_TOKEN: ${{ secrets.QA_TOKEN }}
        run: |
          printf '{"suite":"api-torneo","fecha":"%s","commit":"%s","corrida":"%s"}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${GITHUB_SHA::7}" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > en-curso.json
          gh api -X PUT "repos/daveprojectdev/qa/contents/data/en-curso/api-torneo/${{ github.run_id }}-${{ github.run_attempt }}.json" \
            -f message="api-torneo: en ejecución (${{ github.run_id }})" \
            -f content="$(base64 -w0 en-curso.json)" --silent
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Estilo
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pruebas (unitarias, propiedades, API, contrato y oráculo)
        run: uv run pytest --cov=app --cov-report=term --cov-report=html:reporte/cobertura --cov-report=json:reporte/cobertura.json --junitxml=reporte/junit.xml
      - name: Informe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informe-de-pruebas-py${{ matrix.python }}
          path: reporte/
      # qa.davidameth.dev: una corrida por push a main, con la Python de
      # producción (3.12). Si la suite no llegó a correr (falló el estilo), no
      # hay JUnit y no se publica nada.
      - name: Publicar en qa.davidameth.dev
        # Un fallo al publicar (token vencido, GitHub caído) no dice nada de
        # las pruebas: se ve en el log, pero la corrida no se pone en rojo.
        continue-on-error: true
        if: ${{ !cancelled() && env.QA_TOKEN != '' && github.event_name == 'push' && matrix.python == '3.12' }}
        env:
          GH_TOKEN: ${{ secrets.QA_TOKEN }}
        run: |
          test -f reporte/junit.xml || { echo "Sin junit.xml: las pruebas no llegaron a correr."; exit 0; }
          uv run python scripts/resumen_qa.py reporte/junit.xml reporte/cobertura.json > resumen.json
          cat resumen.json
          nombre="$(date -u +%Y%m%dT%H%M%SZ)-${{ github.run_id }}-${{ github.run_attempt }}.json"
          gh api -X PUT "repos/daveprojectdev/qa/contents/data/corridas/api-torneo/$nombre" \
            -f message="api-torneo: $(jq -r .resultado resumen.json) (${{ github.run_id }})" \
            -f content="$(base64 -w0 resumen.json)" --silent
      # Borra el aviso de «en ejecución» aunque la corrida haya fallado o se
      # haya cancelado. Si no existe (no se pudo crear), no pasa nada.
      - name: Quitar el aviso de qa.davidameth.dev
        continue-on-error: true
        if: ${{ always() && env.QA_TOKEN != '' && github.event_name == 'push' && matrix.python == '3.12' }}
        env:
          GH_TOKEN: ${{ secrets.QA_TOKEN }}
        run: |
          ruta="repos/daveprojectdev/qa/contents/data/en-curso/api-torneo/${{ github.run_id }}-${{ github.run_attempt }}.json"
          sha=$(gh api "$ruta" --jq .sha 2>/dev/null) || { echo "No había aviso."; exit 0; }
          gh api -X DELETE "$ruta" -f message="api-torneo: terminó (${{ github.run_id }})" -f sha="$sha" --silent
