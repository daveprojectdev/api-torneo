name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Estilo
        run: |
          ruff check .
          ruff format --check .
      - name: Pruebas (unitarias, propiedades, API, contrato y oráculo)
        run: pytest --cov=app --cov-report=term --cov-report=html:reporte/cobertura --junitxml=reporte/junit.xml
      - name: Informe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informe-de-pruebas
          path: reporte/
